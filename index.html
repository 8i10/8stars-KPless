<style>
:root{--bg:#14161c;--card:#1f232c;--tx:#e8e8ec;--sub:#9aa0ad;--ac:#c9a85c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Yu Gothic",sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:480px;background:var(--card);border-radius:14px;padding:28px 22px;text-align:center;line-height:1.8}
h1{font-size:20px;margin:0 0 6px;color:var(--ac)}
p{margin:0 0 18px;color:var(--sub);font-size:14px}
label.btn{display:block;padding:16px;border:2px dashed #555b68;border-radius:12px;cursor:pointer;font-size:16px}
label.btn:hover,.drag label.btn{border-color:var(--ac);color:var(--ac)}
input{display:none}
#err{color:#e57373;font-size:14px;margin-top:14px;min-height:1em}
</style>
</head>
<body>
<main><div class="box">
<h1>KPレス プレイヤー</h1>
<p>受け取ったKPレス用HTMLファイルを選ぶとプレイが始まります。</p>
<label class="btn">ファイルを選ぶ<input type="file" id="f" accept=".html,.htm,text/html"></label>
<div id="err"></div>
</div></main>
<script>
(function(){
  var f=document.getElementById("f"),err=document.getElementById("err");
  function decode(html){
    var doc=new DOMParser().parseFromString(html,"text/html");
    var e=doc.getElementById("scn-enc");
    if(!e)return html;
    var k=e.getAttribute("data-k")||"",kb=[];
    for(var i=0;i<k.length;i+=2)kb.push(parseInt(k.substr(i,2),16));
    var d=atob(e.textContent.replace(/\s/g,"")),u=new Uint8Array(d.length);
    for(var j=0;j<d.length;j++)u[j]=d.charCodeAt(j)^kb[j%kb.length];
    return new TextDecoder().decode(u);
  }
  function play(file){
    if(!file)return;
    err.textContent="";
    var r=new FileReader();
    r.onload=function(){
      var out;
      try{out=decode(String(r.result));}catch(x){err.textContent="ファイルを読み込めませんでした。";return;}
      if(!/<html|<body|<script/i.test(out)){err.textContent="KPレス用HTMLファイルを選んでください。";return;}
      document.open();document.write(out);document.close();
    };
    r.onerror=function(){err.textContent="ファイルを読み込めませんでした。";};
    r.readAsText(file,"utf-8");
  }
  f.addEventListener("change",function(){play(f.files[0]);});
  document.addEventListener("dragover",function(e){e.preventDefault();document.body.classList.add("drag");});
  document.addEventListener("dragleave",function(){document.body.classList.remove("drag");});
  document.addEventListener("drop",function(e){e.preventDefault();document.body.classList.remove("drag");if(e.dataTransfer.files[0])play(e.dataTransfer.files[0]);});
})();
</script>
</body>
</html>
